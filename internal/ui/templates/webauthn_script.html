{{define "webauthn-script"}}
<script nonce="{{.}}">
(function () {
  "use strict";
  var data = document.getElementById("za-webauthn");
  if (!data || !window.PublicKeyCredential) { return; }
  var opts;
  try { opts = JSON.parse(data.textContent); } catch (e) { return; }
  var form = document.querySelector("form");
  if (!form) { return; }
  var credField = form.querySelector('input[name="credential"]');
  var errField = form.querySelector('input[name="webauthn_error"]');
  var platField = form.querySelector('input[name="platform_authenticator"]');
  var controller = null;
  var done = false;

  function b64uToBuf(s) {
    s = String(s).replace(/-/g, "+").replace(/_/g, "/");
    while (s.length % 4) { s += "="; }
    var bin = atob(s), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) { out[i] = bin.charCodeAt(i); }
    return out.buffer;
  }
  function bufToB64u(buf) {
    var bytes = new Uint8Array(buf), bin = "";
    for (var i = 0; i < bytes.length; i++) { bin += String.fromCharCode(bytes[i]); }
    return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  function toPublicKey(options) {
    if (typeof PublicKeyCredential.parseRequestOptionsFromJSON === "function") {
      return PublicKeyCredential.parseRequestOptionsFromJSON(options);
    }
    var pk = { challenge: b64uToBuf(options.challenge), timeout: options.timeout, rpId: options.rpId,
               userVerification: options.userVerification, allowCredentials: [] };
    (options.allowCredentials || []).forEach(function (c) {
      pk.allowCredentials.push({ type: c.type, id: b64uToBuf(c.id), transports: c.transports });
    });
    return pk;
  }
  function serialize(cred) {
    var r = cred.response;
    var out = { id: cred.id, rawId: bufToB64u(cred.rawId), type: cred.type,
                response: { clientDataJSON: bufToB64u(r.clientDataJSON), authenticatorData: bufToB64u(r.authenticatorData),
                            signature: bufToB64u(r.signature) } };
    if (cred.authenticatorAttachment) { out.authenticatorAttachment = cred.authenticatorAttachment; }
    if (r.userHandle) { out.response.userHandle = bufToB64u(r.userHandle); }
    if (typeof cred.getClientExtensionResults === "function") {
      try { out.clientExtensionResults = cred.getClientExtensionResults(); } catch (e) {}
    }
    return out;
  }
  function abortPending() {
    if (controller) { try { controller.abort(); } catch (e) {} controller = null; }
  }
  function submit(cred) {
    done = true;
    credField.value = JSON.stringify(serialize(cred));
    errField.value = "";
    form.submit();
  }
  function fail(err) {
    done = true;
    credField.value = "";
    errField.value = (err && err.name) ? String(err.name) : "UnknownError";
    form.submit();
  }
  function request(mediation) {
    controller = new AbortController();
    return navigator.credentials.get({ publicKey: toPublicKey(opts), mediation: mediation, signal: controller.signal });
  }

  // The local-enrollment prompt is offered only when this browser has a
  // user-verifying platform authenticator (spec section 3.5).
  if (platField && PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable) {
    PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().then(function (ok) {
      if (ok) { platField.value = "1"; }
    }, function () {});
  }

  form.addEventListener("submit", function () { if (!done) { abortPending(); } });

  var button = document.getElementById("za-passkey-button");
  if (button) {
    button.addEventListener("click", function (ev) {
      ev.preventDefault();
      abortPending();
      request(undefined).then(submit, fail);
    });
  }

  if (typeof PublicKeyCredential.isConditionalMediationAvailable === "function") {
    PublicKeyCredential.isConditionalMediationAvailable().then(function (ok) {
      if (!ok) { return; }
      request("conditional").then(function (cred) {
        if (!done) { submit(cred); }
      }, function (err) {
        if (!done && err && err.name !== "AbortError" && err.name !== "NotAllowedError") { fail(err); }
      });
    }, function () {});
  }
})();
</script>
{{end}}
